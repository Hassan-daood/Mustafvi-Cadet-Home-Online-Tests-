{% extends 'base.html' %}
{% block title %}Change Admin Password{% endblock %}
{% block content %}
<div class="report-actions compact-actions">
  <a class="button-link" href="{{ url_for('admin_dashboard') }}">Back to Admin Dashboard</a>
</div>
<section class="card narrow">
  <h1>Change Admin Password</h1>
  <form method="post" action="{{ url_for('change_admin_password') }}" autocomplete="off">
    <label>Current password</label>
    <input type="password" name="current_password" placeholder="Write password" autocomplete="current-password" autofocus required>
    <label>New password</label>
    <input type="password" name="new_password" placeholder="Write new password" minlength="6" autocomplete="new-password" required>
    <label>Confirm new password</label>
    <input type="password" name="confirm_password" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required>
    <button type="submit">Change Password</button>
  </form>
</section>
{% endblock %}
